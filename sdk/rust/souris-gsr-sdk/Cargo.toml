[package]
name = "souris-gsr-sdk"
version = "0.1.0"
edition = "2021"
description = "Embeddable Rust SDK for SourisGSR (recording engine). Full control, GPL-3.0-only."
license = "GPL-3.0-only"
repository = "https://github.com/SourisCG/SourisGSR"

[lib]
name = "souris_gsr_sdk"
crate-type = ["rlib"]

[features]
default = []
ffi = []  # link against libsouris_gsr (C ABI) once available
